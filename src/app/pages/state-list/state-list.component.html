<div class="navbar">
  <div class="navbar-left">
    <h1 class="logo">State Records</h1>
  </div>
  <div class="navbar-right">
    <input 
      type="text"
      placeholder="Search states..."
      class="search-input"
      (input)="onSearch($event)"
      [(ngModel)]="searchTerm">
    <button 
      class="export-btn bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-md flex items-center gap-1.5 text-sm transition-colors"
      (click)="exportToExcel()"
      [disabled]="states.length === 0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      Export
    </button>
  </div>
</div>

<div class="p-6">
  <div class="overflow-x-auto">
    <table class="min-w-full border border-gray-300 rounded-lg shadow-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="border px-4 py-2 text-left">State Name</th>
          <th class="border px-4 py-2 text-left">Short Code</th>
          <th class="border px-4 py-2 text-left">Status</th>
          <th class="border px-4 py-2 text-left">Client</th>
          <th class="border px-4 py-2 text-left">Action</th>

        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of filteredStates" class="hover:bg-gray-50">
          <td class="border px-4 py-2 font-medium">
            {{ s.zoneName }}
          </td>

          <td class="border px-4 py-2">
            {{ s.zoneshortCode }}
          </td>

          <td class="border px-4 py-2">
            <span
              class="px-2 py-1 rounded text-white text-sm"
              [ngClass]="{
                'bg-green-500': s.zonestatus === 'Y',
                'bg-red-500': s.zonestatus === 'N'
              }"
            >
              {{ s.zonestatus === 'Y' ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="border px-4 py-2">
            {{ s.clientName }}
          </td>
          <td class="border px-4 py-2">
  <button
    class="px-3 py-1 bg-blue-500 text-white rounded text-sm edit-btn"
    (click)="editState(s)">
    Edit
  </button>
</td>

        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty State -->
  <p *ngIf="states.length === 0" class="mt-4 text-gray-500">
    No states found.
  </p>
</div>
