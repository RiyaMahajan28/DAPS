<div class="navbar">
  <div class="navbar-left">
    <h1 class="logo">State Records</h1>
  </div>
</div>

<div class="p-6">
  <div class="overflow-x-auto">
    <table class="min-w-full border border-gray-300 rounded-lg shadow-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="border px-4 py-2 text-left">State Name</th>
          <th class="border px-4 py-2 text-left">Short Code</th>
          <th class="border px-4 py-2 text-left">Status</th>
          <th class="border px-4 py-2 text-left">Client</th>
          <th class="border px-4 py-2 text-left">Action</th>

        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of states" class="hover:bg-gray-50">
          <td class="border px-4 py-2 font-medium">
            {{ s.zoneName }}
          </td>

          <td class="border px-4 py-2">
            {{ s.zoneshortCode }}
          </td>

          <td class="border px-4 py-2">
            <span
              class="px-2 py-1 rounded text-white text-sm"
              [ngClass]="{
                'bg-green-500': s.zonestatus === 'Y',
                'bg-red-500': s.zonestatus === 'N'
              }"
            >
              {{ s.zonestatus === 'Y' ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="border px-4 py-2">
            {{ s.clientName }}
          </td>
          <td class="border px-4 py-2">
  <button
    class="px-3 py-1 bg-blue-500 text-white rounded text-sm edit-btn"
    (click)="editState(s)">
    Edit
  </button>
</td>

        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty State -->
  <p *ngIf="states.length === 0" class="mt-4 text-gray-500">
    No states found.
  </p>
</div>
