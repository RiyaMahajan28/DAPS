<div class="form-container">
  <div class="form-card">

    <h2 class="form-title">
  {{ isEdit ? 'Edit State' : 'Add State' }}
</h2>


    <form [formGroup]="stateForm" (ngSubmit)="onSave()">

      <!-- Client ID -->
      <!-- <div class="form-group">
        <label>Client ID</label>
        <input type="number" formControlName="clientId" placeholder="Enter Client ID" />
        <p class="error" *ngIf="stateForm.get('clientId')?.invalid && stateForm.get('clientId')?.touched">
          Client ID is required
        </p>
      </div> -->
      <!-- Client Name -->
<div class="form-group">
  <label>Client Name</label>
  <select formControlName="clientId">
    <option value="">Select Client</option>
    <option *ngFor="let client of clients" [value]="client.clientId">
      {{ client.clientName }}
    </option>
  </select>

  <p class="error"
     *ngIf="stateForm.get('clientId')?.invalid && stateForm.get('clientId')?.touched">
    Client is required
  </p>
</div>

      <!-- State Name -->
      <div class="form-group">
        <label>State Name</label>
        <input type="text" formControlName="zoneName" placeholder="Enter State Name" />
        <p class="error" *ngIf="stateForm.get('zoneName')?.invalid && stateForm.get('zoneName')?.touched">
          State Name is required
        </p>
      </div>

      <!-- Short Code -->
      <div class="form-group">
        <label>Short Code</label>
        <input type="text" formControlName="zoneshortCode" maxlength="2" placeholder="Enter Short Code" />
        <p class="error" *ngIf="stateForm.get('zoneshortCode')?.invalid && stateForm.get('zoneshortCode')?.touched">
          Short Code is required
        </p>
         <span class="error" *ngIf="stateForm.get('zoneshortCode')?.errors?.['minlength'] 
               || stateForm.get('zoneshortCode')?.errors?.['maxlength']">
               Short Code must be exactly 2 characters
         </span>
      </div>

      <!-- Status -->
      <!-- <div class="form-group">
        <label>Status</label>
        <input type="text" formControlName="zonestatus" placeholder="Select Status" />
      </div> -->
      <div class="form-group">
  <label>Status</label>
  <select formControlName="zonestatus">
    <option value="">-- Select Status --</option>
    <option value="Y">Active</option>
    <option value="N">Inactive</option>
  </select>

    <p class="error"
         *ngIf="stateForm.get('zonestatus')?.invalid && stateForm.get('zonestatus')?.touched">
        Status is required
        </p>

</div>

        <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter Email" />
      </div>

      <!-- Buttons -->
      <button type="submit" class="btn-primary">Save</button>
      <button type="button" class="btn-primary" (click)="goBack()">Back</button>

    </form>
  </div>
</div>
