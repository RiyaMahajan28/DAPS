<div class="dashboard-container">
  <h2>Dashboard</h2>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && data && data.length === 0">No data available</div>

  <div *ngIf="data && data.length > 0">
    <div class="controls">
      <button (click)="renderCharts()">Render Charts</button>
      <button (click)="loadChartData()">Refresh</button>
    </div>

    <div class="chart-area">
      <canvas id="dashboardChart" height="220"></canvas>
    </div>

    <h3>Raw data</h3>
    <table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Client</th>
          <th>Current</th>
          <th>Last</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of data; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ r.clientName || r.client_name || ('#' + r.client_id) }}</td>
          <td>{{ r.currentMCount ?? r.currentCount ?? 0 }}</td>
          <td>{{ r.lastMCount ?? r.lastCount ?? 0 }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
