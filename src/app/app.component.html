<!-- Header -->
<app-header
  *ngIf="!isLoginPage"
  [isSidebarCollapsed]="isSidebarCollapsed">
</app-header>

<!-- Sidebar -->
<app-sidebar
  *ngIf="!isLoginPage"
  (collapsedChange)="onSidebarToggle($event)">
</app-sidebar>

<!-- Main content -->
<div
  class="main-content"
  [class.collapsed]="isSidebarCollapsed"
  [class.no-sidebar]="isLoginPage">

  <router-outlet></router-outlet>
</div>
